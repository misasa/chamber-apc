[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chamber-apc"
version = "1.0.0"
description = "Local control panel and mock device for chamber pressure regulation"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
chamber-apc-control = "chamber_apc_control.control:main"
chamber-apc-mock = "chamber_apc_control.mock_device:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
